services:
  db:
    image: postgres:16
    container_name: arenah_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: arenah_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata: