services:
  db:
    image: postgres:16
    container_name: arenah_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: arenah_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Back-end dans Docker : facultatif en développement
  # Lancement : docker compose --profile complet up -d --build
  backend:
    profiles: ["complet"]
    build: ./backend
    container_name: arenah_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro

volumes:
  pgdata:
